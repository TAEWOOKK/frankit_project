# .platform/nginx/conf.d/custom.conf

# 업로드 용량 제한
client_max_body_size 10M;

upstream springapp {
    server 127.0.0.1:8080; # Spring Boot 애플리케이션이 8080 포트에서 실행 중일 경우
    keepalive 256;
}

server {
    listen 80;
    location / {
        proxy_pass http://springapp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
