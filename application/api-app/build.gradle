bootJar.enabled = true
jar.enabled = false

ext {
    set('springCloudVersion', "2023.0.3")
}

dependencies {

    // 모듈 추가
    implementation project(':module-java')
    implementation project(':domain:common')
    implementation project(':domain:member')
    implementation project(':domain:product')

    implementation project(':configuration:persistence')
    implementation project(':configuration:web-common')
    implementation project(':configuration:springdoc')
    implementation project(':configuration:security')
    implementation project(':configuration:feign')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    
    // queryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}